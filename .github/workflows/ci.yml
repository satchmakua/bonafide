# CI — lint, typecheck, and test on every push / PR.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install
        run: uv pip install --system -e ".[dev,provenance]"

      - name: Lint
        run: ruff check .

      - name: Typecheck
        run: mypy src tests

      - name: Test
        run: pytest
